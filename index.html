<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin an Egg Admin</title><style>body{background:#07110b;color:#dfffe7;font:15px system-ui;max-width:900px;margin:auto;padding:18px}section{background:#102018;border:1px solid #31563c;border-radius:12px;padding:14px;margin:12px 0}input,button{width:100%;padding:12px;margin:5px 0;background:#08150d;color:white;border:1px solid #31563c;border-radius:8px}button{background:#23783d}table{width:100%;text-align:left}td,th{padding:6px;border-bottom:1px solid #294334}pre{white-space:pre-wrap}.hide{display:none}</style></head><body><h1>🥚 Spin an Egg Admin</h1><section id="login"><h3>Admin login</h3><input id="user" placeholder="Admin username"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="msg"></p></section><div id="panel" class="hide"><section><h2>Status</h2><p id="status">Loading…</p><progress id="progress" max="4" value="0"></progress><p id="uptime"></p></section><section><h2>Webhook</h2><input id="url" readonly><button onclick="copy()">Copy webhook URL</button><p>Set verify token to the value in setting.json. Subscribe Page webhook to messages and messaging_postbacks.</p></section><section><h2>Commands</h2><div id="cmds"></div></section><section><h2>Pet list</h2><div id="pets"></div></section><section><h2>Mutations</h2><div id="mutations"></div></section><button onclick="location.reload()">Logout</button></div><script>
let token="";
const el=id=>document.getElementById(id);
async function login(){const response=await fetch("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:el("user").value,password:el("pass").value})});if(!response.ok){el("msg").textContent="Login failed";return}token=(await response.json()).token;el("login").classList.add("hide");el("panel").classList.remove("hide");load()}
async function load(){const response=await fetch("/admin/data",{headers:{Authorization:"Bearer "+token}});if(!response.ok){el("status").textContent="Unable to load data";return}const d=await response.json();el("status").textContent="MongoDB: "+d.status+" | Commands: "+d.commands.length;el("progress").value=4;el("uptime").textContent="Uptime "+Math.floor(d.uptime/60)+" min";el("url").value=d.webhook;el("cmds").innerHTML="<pre>"+d.commands.map(c=>c.name+" ["+c.permission+"] "+c.usage+" — "+c.description).join("\n")+"</pre>";el("pets").innerHTML="<pre>"+d.pets.map(p=>p.name+" | "+p.rarity+" | weight "+p.baseWeight+" | ₱"+p.baseMoneyPerSecond+"/s | "+p.chance+"%").join("\n")+"</pre>";el("mutations").innerHTML="<pre>"+d.mutations.map(m=>m.name+" ×"+m.multiplier+" | ₱"+m.price).join("\n")+"</pre>"}
function copy(){const input=el("url");input.select();if(navigator.clipboard)navigator.clipboard.writeText(input.value).catch(()=>document.execCommand("copy"));else document.execCommand("copy")}
</script></div></body></html>
